# Render Blueprint —— 在 Render 選 New > Blueprint，指到這個 repo 就會自動建好服務。
#
# sync: false 的變數不會存在這個檔案裡，Render 會在建立時跳出來問你，
# 填進去之後存在 Render 自己的加密環境變數裡。API key 不要寫進這個檔案。

services:
  - name: live-captions
    type: web
    runtime: node
    plan: free
    region: frankfurt         # 活動在牛津，用歐洲節點。原本設 singapore 會讓每個請求多繞地球半圈
    buildCommand: npm install  # 零相依，這步等於什麼都不做
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"

      # ---- 祕密：Render 建立時會問你 ----
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ROOM_CODE
        sync: false
      - key: OPERATOR_KEY
        sync: false

      # ---- 一般設定 ----
      - key: STT_LANGUAGE
        value: en-GB
      - key: STT_MODEL
        value: nova-3

      # 實測選出來的：p50 736ms、8 次零失敗、台灣繁中零問題。
      # 不要用預設的 gemini-3.7-flash（免費層額度不足且 thinking 設定不相容）。
      - key: TRANSLATE_PROVIDER
        value: gemini
      - key: TRANSLATE_MODEL
        value: gemini-3.1-flash-lite

      # 整理筆記一天只呼叫一次，用強一點的
      - key: SUMMARY_MODEL
        value: gemini-3.5-flash
